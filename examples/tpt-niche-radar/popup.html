<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Niche Radar</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="head">
      <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" /><circle cx="8" cy="8" r="2.25" fill="currentColor" /></svg>
      <span class="name">Niche Radar</span>
      <span class="version" id="version"></span>
    </header>
    <section class="block" id="tab">
      <p class="label">This tab</p>
      <div id="tab-body"><p class="hint">Checking the page</p></div>
    </section>
    <section class="block">
      <div class="toggle-row">
        <span><strong>Save lookups automatically</strong><small>Keyword numbers, weekly curve and related keywords</small></span>
        <button class="switch" role="switch" id="auto-save" aria-checked="true" aria-label="Save lookups automatically"></button>
      </div>
    </section>
    <section class="block" id="recent-block" hidden>
      <p class="label">Recent</p>
      <ul class="recent" id="recent"></ul>
    </section>
    <footer class="foot">
      <button class="btn primary" id="open-dashboard">Open workspace</button>
      <p class="note" id="status" role="status" aria-live="polite">Stored in this browser, nothing leaves it</p>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
